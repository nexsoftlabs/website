# NexSoft Labs — Render Blueprint (contact form API)
services:
  - type: web
    name: nexsoft-contact-api
    runtime: node
    region: singapore
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CONTACT_INBOX
        value: labs.nexsoft@gmail.com
      - key: RESEND_FROM
        value: NexSoft Labs Website <hello@nexsoftlabs.in>
      - key: ALLOWED_ORIGINS
        value: https://nexsoftlabs.in,https://www.nexsoftlabs.in,http://localhost:5173,http://localhost:5180
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: WHATSAPP_NOTIFY_TO
        sync: false
