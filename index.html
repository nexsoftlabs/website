<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="NexSoft Labs is a software engineering consultancy building custom web applications, mobile apps, SaaS products, AI workflows and cloud systems." />
    <meta property="og:site_name" content="NexSoft Labs" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexsoftlabs.in/" />
    <meta property="og:title" content="NexSoft Labs — We engineer software that moves business forward" />
    <meta property="og:description" content="Custom web applications, mobile apps, SaaS products, AI workflows and cloud systems—engineered around real business outcomes." />
    <meta property="og:image" content="https://nexsoftlabs.in/og/og-default.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nexsoftlabs.in/og/og-default.png" />
    <script>
      (function () {
        var key = 'nexsoft-color-scheme'
        var pref = 'light'
        try {
          var stored = localStorage.getItem(key)
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = dark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#08111F' : '#0B1730')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
